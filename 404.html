<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Human Heart</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback
      // This file is served for any path that doesn't match a real file.
      // The build workflow (static.yml) copies dist/index.html to dist/404.html,
      // which is the actual fallback used in production.
      // This repo-root file is only a safety net for development.
      sessionStorage.setItem('spa-redirect', window.location.href);
      window.location.replace('/');
    </script>
  </head>
  <body></body>
</html>
